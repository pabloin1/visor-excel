{% extends 'documents/base.html' %}
{% block title %}Ingresar | Visor de Excel{% endblock %}
{% block content %}
<section class="flow-page login-page" aria-labelledby="login-title">
  <div class="flow-card">
    <h1 id="login-title">Ingresar al visor</h1>
    <p>Accede para consultar la biblioteca y cargar versiones.</p>
    {% if form.errors %}<p class="form-error" role="alert">Usuario o contraseña incorrectos.</p>{% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="flow-field" for="id_username">Usuario
        <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
      </label>
      <label class="flow-field" for="id_password">Contraseña
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="primary" type="submit">Ingresar</button>
    </form>
  </div>
</section>
{% endblock %}

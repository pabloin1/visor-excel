services:
  - type: web
    name: visor-excel-demo
    runtime: python
    plan: free
    buildCommand: bash ./build.sh
    startCommand: bash ./start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visor-excel-demo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: VISOR_DEBUG
        value: "0"
      - key: VISOR_REQUIRE_LOGIN
        value: "1"
      - key: VISOR_ORIGINAL_STORAGE
        value: database
      - key: VISOR_DATA_ROOT
        value: /tmp/visor-excel
      - key: VISOR_ADMIN_USERNAME
        sync: false
      - key: VISOR_ADMIN_PASSWORD
        sync: false
databases:
  - name: visor-excel-demo-db
    plan: free
